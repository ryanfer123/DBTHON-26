name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend --locked ruff check backend
      - run: uv run --project backend --locked mypy --config-file backend/pyproject.toml backend/app
      - run: uv run --project backend --locked pytest backend/tests
      - run: uv run --project backend --locked python scripts/export_openapi.py --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
  browser:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: dbthon
      POSTGRES_DB: dbthon
      POSTGRES_PASSWORD: dbthon-ci-only
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: dbthon
          POSTGRES_DB: dbthon
          POSTGRES_PASSWORD: dbthon-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbthon -d dbthon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: npm ci --prefix frontend
      - run: uv run --project backend --locked python scripts/database.py migrate
      - run: uv run --project backend --locked python scripts/provision_access.py
      - run: uv run --project backend --locked pytest backend/tests --db
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
