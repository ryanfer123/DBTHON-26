name: dbthon
services:
  db:
    image: postgis/postgis:17-3.5
    # The upstream image lists amd64 support. Emulate on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbthon}
      POSTGRES_USER: ${POSTGRES_USER:-dbthon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbthon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  dbthon_pgdata:
