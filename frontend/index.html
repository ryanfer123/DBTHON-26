<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = localStorage.getItem('second-table-theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="theme-color" content="#173d2d" />
    <meta name="description" content="Connect surplus food with people nearby. Donate, collect, and deliver within your community." />
    <link rel="icon" href="data:," />
    <title>Second Table · Food shared locally</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
